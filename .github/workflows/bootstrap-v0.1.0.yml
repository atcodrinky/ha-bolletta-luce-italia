name: Pubblica versione 0.1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crea i file della versione
        env:
          PROJECT_PAYLOAD: 
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          files = json.loads(base64.b64decode(os.environ["PROJECT_PAYLOAD"]))
          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          PY
      - name: Registra la versione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Rilascia Bolletta Luce Italia 0.1.0"
          git push origin main
          git tag -a v0.1.0 -m "Bolletta Luce Italia 0.1.0"
          git push origin v0.1.0
