name: Genera icone brand

on:
  push:
    branches:
      - main
    paths:
      - "exec-657bcb4c-de82-42d1-8e55-284a852a57d1.png"
      - ".github/workflows/brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa il generatore di immagini
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Genera le icone
        shell: bash
        run: |
          mkdir -p custom_components/bolletta_luce_italia/brand
          convert exec-657bcb4c-de82-42d1-8e55-284a852a57d1.png \
            -background none -resize 256x256 -gravity center -extent 256x256 \
            -strip -interlace PNG \
            custom_components/bolletta_luce_italia/brand/icon.png
          convert exec-657bcb4c-de82-42d1-8e55-284a852a57d1.png \
            -background none -resize 512x512 -gravity center -extent 512x512 \
            -strip -interlace PNG \
            custom_components/bolletta_luce_italia/brand/icon@2x.png

      - name: Pubblica le icone
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/bolletta_luce_italia/brand
          if ! git diff --cached --quiet; then
            git commit -m "Aggiunge le icone brand dell'integrazione"
            git push
          fi
