name: Verifica

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sintassi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verifica sintassi Python e JSON
        run: |
          python -m compileall -q custom_components
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Verifica registro delle modifiche
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path(
                  "custom_components/bolletta_luce_italia/manifest.json"
              ).read_text(encoding="utf-8")
          )
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = manifest["version"]
          if f"## [{version}]" not in changelog:
              raise SystemExit(
                  f"La versione {version} non è documentata in CHANGELOG.md"
              )
          PY

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
